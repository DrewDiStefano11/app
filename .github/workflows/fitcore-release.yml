name: FitCore Release Gate

on:
  pull_request:
    branches: [main, "codex/fitcore-core-integration", "codex/fitcore-jarvis-voice", "codex/fitcore-daily-usability", "codex/fitcore-record-consistency", "codex/fitcore-save-safety"]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-browser:
    name: production-browser (${{ matrix.project }})
    runs-on: ubuntu-latest
    # Both engines retain the complete selection, on independent runners.
    # The serial two-engine job exceeded its 35-minute ceiling.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        project: [iphone-webkit, mobile-390x844]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm ci
      - run: bun test tests/unit
      - name: Build Vercel artifact
        run: |
          npm run build
          test -s .vercel/output/config.json
          test -s .vercel/output/functions/__server.func/index.mjs
        env:
          VERCEL: "1"
      - run: npx playwright install --with-deps chromium webkit
      - name: Test the production artifact in mobile browsers
        run: >-
          npm run test:e2e -- --reporter=line
          --project=${{ matrix.project }}
          whoop-callback.spec.ts whoop-dashboard.spec.ts whoop-jarvis.spec.ts whoop-jarvis-isolation.spec.ts whoop-sync.spec.ts privacy-policy.spec.ts
          whoop-owner-archive.spec.ts
          workout-release-safety settings-data-safety-lifecycle-smoke settings-access-reminders goals-recorded-metrics
          active-workout-lifecycle-smoke workout-offline-reopen bench-program reusable-workouts workout-rest-timer training-routines personal-scores workout-storage-headroom workout-substitutions exercise-library workout-history-management
          meal-corrections macro-trends saved-nutrition food-library nutrition-targets jarvis-active-workout jarvis-voice jarvis-workout-history jarvis-text-provider jarvis-provider-policy jarvis-text-records jarvis-recorded-meals recorded-sleep daily-input-usability jarvis-composer-cursor section-scroll-activity save-safety jarvis-food-photo meal-photo-camera-access meal-photo-multiple nutrition-macro-completeness weigh-in-save-safety
          stats-recorded-correlations
        env:
          FITCORE_TEST_IPHONE_WEBKIT: "1"
          FITCORE_TEST_PRODUCTION_BUILD: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fitcore-release-test-results-${{ matrix.project }}
          path: test-results/
          retention-days: 14

  production-workout:
    # Keep the existing required-check name; every engine must actually pass.
    needs: production-browser
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require both production browser jobs to pass
        env:
          BROWSER_RESULT: ${{ needs.production-browser.result }}
        run: test "$BROWSER_RESULT" = "success"
